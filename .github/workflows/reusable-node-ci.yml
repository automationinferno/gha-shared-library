name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to test against (ignored if node-version-file is set)'
        required: false
        type: string
        default: ''
      node-version-file:
        description: 'Path to .nvmrc or .node-version file'
        required: false
        type: string
        default: ''
      run-lint:
        description: 'Whether to run npm run lint'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to run npm test'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Whether to run npm run build'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Subdirectory where package.json lives'
        required: false
        type: string
        default: '.'
    outputs:
      ci-status:
        description: 'Final execution status of CI pipeline'
        value: ${{ jobs.build-and-test.outputs.status }}

permissions: {}

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.record-status.outputs.status }}
    steps:
      - name: Checkout repository source
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Setup Node environment via shared composite action
        id: setup
        uses: automationinferno/gha-shared-library/actions/setup-node-env@v1
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run code linter
        if: ${{ inputs.run-lint }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          npm run lint

      - name: Run automated test suite
        if: ${{ inputs.run-test }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          npm test

      - name: Build application bundle
        if: ${{ inputs.run-build }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          npm run build

      - name: Generate build summary via shared composite action
        if: always()
        uses: automationinferno/gha-shared-library/actions/build-summary@v1
        with:
          title: 'Node.js CI Verification'
          node-version: ${{ inputs.node-version }}
          lint-result: ${{ inputs.run-lint && 'success' || 'skipped' }}
          test-result: ${{ inputs.run-test && 'success' || 'skipped' }}
          build-result: ${{ inputs.run-build && 'success' || 'skipped' }}

      - name: Record pipeline output status
        id: record-status
        if: always()
        shell: bash
        run: |
          echo "status=completed" >> "$GITHUB_OUTPUT"
