name: Reusable Release Drafter

on:
  workflow_call:
    inputs:
      config-name:
        description: 'Path or name of release-drafter config file in the shared library repository'
        required: false
        type: string
        default: 'release-drafter.yml'

permissions: {}

jobs:
  draft-release:
    name: Draft Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Run Release Drafter (using central automationinferno/.github fallback)
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: ${{ inputs.config-name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
