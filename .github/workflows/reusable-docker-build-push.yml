name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      tags:
        description: 'Newline- or comma-separated list of image tags (e.g. moralerr/examples:app-sha)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated target platforms for Buildx (e.g. linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to repository root'
        required: false
        type: string
        default: 'Dockerfile'
      registry:
        description: 'Container registry host (default docker.io)'
        required: false
        type: string
        default: 'docker.io'
      push:
        description: 'Whether to push the built image to the registry'
        required: false
        type: boolean
        default: false
      cache-enabled:
        description: 'Whether to use GitHub Actions Buildx cache (type=gha)'
        required: false
        type: boolean
        default: true
      provenance:
        description: 'Whether to attach SLSA provenance attestation when pushing'
        required: false
        type: boolean
        default: false
      sbom:
        description: 'Whether to attach SBOM attestation when pushing'
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        description: 'Container registry username (required when push is true)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Container registry password or token (required when push is true)'
        required: false
    outputs:
      digest:
        description: 'Digest of the built container image'
        value: ${{ jobs.build-and-push.outputs.digest }}

permissions: {}

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU for cross-platform builds
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          cache-from: ${{ inputs.cache-enabled && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache-enabled && 'type=gha,mode=max' || '' }}
          provenance: ${{ inputs.push && inputs.provenance }}
          sbom: ${{ inputs.push && inputs.sbom }}
